<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arth — Market Dashboard</title>

    <!-- Fonts -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script> 

    <!-- Chart.js -->
    <!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Luxon (date handling) -->
<script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

<!-- Chart.js date adapter -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1"></script>

<!-- Chart.js Candlestick plugin -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.1/dist/chartjs-chart-financial.min.js"></script>

    <!-- Your styles -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- ── HEADER ─────────────────────────────── -->
    <header id="header">
      <div class="header-inner">
        <!-- Logo -->
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-label="Arth logo">
            <rect width="28" height="28" rx="7" fill="#2F6B4A"/>
            <text x="7" y="21" font-family="Instrument Serif, serif" font-size="18" fill="white">A</text>
            <line x1="7" y1="24" x2="21" y2="12" stroke="#7ECFA0" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">Arth</span>
        </div>

        <!-- Search -->
        <div class="search-wrapper">
          <input
            type="text"
            id="searchInput"
            placeholder="Search stocks — e.g. INFY, HDFC…"
            autocomplete="off"
          />
          <ul id="searchDropdown" class="search-dropdown hidden"></ul>
        </div>

        <!-- Theme Toggle -->
        <button data-theme-toggle aria-label="Toggle theme" class="theme-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── INDICES BAR ─────────────────────────── -->
    <div id="indicesBar" class="indices-bar">
      <div class="indices-inner" id="indicesList">
        <!-- Populated by JS -->
        <span class="index-skeleton">Loading…</span>
      </div>
      <span id="lastUpdated" class="last-updated">--</span>
    </div>

    <!-- ── MAIN CONTENT ───────────────────────── -->
    <main class="main-content">

      <!-- LEFT: Quote + Chart -->
      <section class="left-panel">

        <!-- Quote Card -->
        <div id="quoteCard" class="quote-card">
          <div class="quote-placeholder">
            <p>Search for a stock above to get started</p>
          </div>
        </div>

        <!-- Chart -->
        <div id="chartSection" class="chart-section hidden">
          <div class="chart-controls">
            <!-- Chart type toggle -->
            <div class="chart-type-toggle">
              <button class="type-btn active" data-type="line">Line</button>
              <button class="type-btn" data-type="candlestick">Candle</button>
            </div>

            <div class="period-divider"></div>

            <!-- Period buttons -->
            <button class="period-btn active" data-period="1mo">1M</button>
            <button class="period-btn" data-period="3mo">3M</button>
            <button class="period-btn" data-period="6mo">6M</button>
            <button class="period-btn" data-period="1y">1Y</button>

            <!-- Full screen button -->
          <button class="fullscreen-btn" id="fullscreenBtn" title="Fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
            </svg>
          </button>

          </div>
          <div class="chart-container">
            <canvas id="priceChart"></canvas>
          </div>
        </div>

      </section>

      <!-- RIGHT: Market Movers -->
      <aside class="right-panel">
        <h2 class="panel-title">Market Movers</h2>

        <div class="movers-section">
          <h3 class="movers-label gainers-label">▲ Top Gainers</h3>
          <ul id="gainersList" class="movers-list">
            <li class="mover-skeleton">Loading…</li>
          </ul>
        </div>

        <div class="movers-section">
          <h3 class="movers-label losers-label">▼ Top Losers</h3>
          <ul id="losersList" class="movers-list">
            <li class="mover-skeleton">Loading…</li>
          </ul>
        </div>
      </aside>

    </main>

    <!-- Your scripts -->
    <script src="app.js"></script>

  </body>
</html>
